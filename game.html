<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWASP Safari | 공격 탐지 게임</title>
    <link rel="stylesheet" href="css/global.css">
    <script src="data/content-data.js" defer></script>
    <script src="data/game-data.js" defer></script>
    <script src="js/main-loader.js" defer></script>
    <script src="js/game.js" defer></script>
</head>
<body>

<nav id="nav-bar" class="site-nav">
    <a class="nav-logo" href="index.html">OWASP Safari</a>
    <div class="nav-links">
        <a href="index.html">메인</a>
        <a href="owasp-intro.html">OWASP 소개</a>
        <a href="team.html">팀 소개</a>
        <a href="news.html">보안 뉴스</a>
        <a href="games.html">게임</a>
        <a href="vuln-broken-auth.html">취약한 인증</a>
        <a href="vuln-injection.html">Injection</a>
        <a href="vuln-xss.html">XSS</a>
        <a href="vuln-bac.html">접근 제어</a>
        <a href="vuln-crypto.html">암호화 오류</a>
        <a href="vuln-ssrf.html">SSRF</a>
    </div>
    <button id="themeToggle" class="theme-btn">🌙 Dark</button>
</nav>

<main id="game-page-container" class="page-container">

    <section class="hero-section">
        <p class="eyebrow" data-content="game.eyebrow">Threat Spotter</p>
        <h1 data-content="game.title">공격 탐지 게임</h1>
        <p class="hero-description" data-content="game.description">불러오는 중...</p>
    </section>

    <section id="game-board" class="game-board">
        <div class="game-topbar">
            <span class="game-time-wrap">⏱ <span id="game-time">30</span>초</span>
            <span id="game-score" class="quiz-score">0점</span>
        </div>
        <div id="game-sample" class="game-sample">▶ 시작을 누르면 입력이 나타납니다</div>
        <div class="game-actions">
            <button id="game-attack" class="game-btn attack" type="button" disabled>🚨 공격 입력 (←)</button>
            <button id="game-safe" class="game-btn safe" type="button" disabled>✅ 정상 입력 (→)</button>
        </div>
        <p id="game-feedback" class="game-feedback"></p>
        <button id="game-start" class="quiz-next-btn" type="button">▶ 시작</button>
    </section>

    <section id="game-result" class="quiz-result" style="display:none">
        <p class="eyebrow">Result</p>
        <h2 id="game-result-score" class="result-score"></h2>
        <p id="game-result-best" class="muted-text"></p>
        <button id="game-restart" class="quiz-next-btn" type="button">다시 하기 ↻</button>
    </section>

</main>

<footer class="site-footer">
    <p data-content="meta.footer">OWASP Safari Project · Educational Purpose Only</p>
</footer>

<script src="js/interactions.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
